<div class="container my-4">
  <h2 class="text-center mb-4">Monthly Report</h2>

  <!-- Year Filter -->
  <div class="row mb-4 justify-content-center">
    <div class="col-md-4">
      <label for="yearSelect" class="form-label">Filter by Year</label>
      <select id="yearSelect" class="form-select" [(ngModel)]="selectedYear" (change)="onYearChange()">
        @for (y of availableYears; track y) {
          <option [value]="y">{{ y }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Download Buttons -->
  <div class="d-flex justify-content-center mb-3">
    <button class="btn btn-outline-primary me-2" (click)="downloadChartImage()">Download Report</button>
    <!-- <button class="btn btn-outline-danger" (click)="downloadChartPDF()">Download PDF</button> -->
  </div>

  <!-- Chart -->
  <div class="row">
    <div class="col-12">
      <div style="position: relative; width: 100%; height: 100%;">
        <canvas id="monthlyEarningsChart"></canvas>
      </div>
    </div>
  </div>
  
</div>
